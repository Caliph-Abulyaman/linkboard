services:
  api:
    build: ./api
    image: linkboard-api:v1.0.0
    ports:
      - "4000:4000"
    env_file:
      - ./api/.env.docker
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD", "node", "./healthcheck.js" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 256m
    cpus: 0.5

  worker:
    build: ./worker
    image: linkboard-worker:v1.0.0
    env_file:
      - ./worker/.env.docker
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD", "node", "./healthcheck.js" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    cpus: 0.75
  frontend:
    build: ./frontend
    image: linkboard-frontend:v1.0.1
    ports:
      - "3000:3000"
    environment:
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: [ "CMD", "node", "./healthcheck.js" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 256m
    cpus: 0.5

  postgres:
    image: postgres:18
    env_file:
      - ./db/.env.docker
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/POSTGRES_PASSWORD
    secrets:
      - source: postgres_password
        target: POSTGRES_PASSWORD
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U linkboard" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 512m
    cpus: 0.5

  redis:
    image: redis:8
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 128m
    cpus: 0.5

volumes:
  postgres-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
