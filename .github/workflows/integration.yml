name: Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write env files from secrets
        run: |
          cat > api/.env.docker <<EOF
          DATABASE_HOST=postgres
          DATABASE_PORT=5432
          DATABASE_NAME=linkboard
          DATABASE_USER=linkboard
          PORT=4000
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          REDIS_HOST=redis
          REDIS_PORT=6379
          EOF

          cat > worker/.env.docker <<EOF
          DATABASE_HOST=postgres
          DATABASE_PORT=5432
          DATABASE_NAME=linkboard
          DATABASE_USER=linkboard
          REDIS_HOST=redis
          REDIS_PORT=6379
          EOF

          cat > db/.env.docker <<EOF
          POSTGRES_USER=linkboard
          POSTGRES_DB=linkboard
          EOF

          mkdir -p secrets
          echo -n "${{ secrets.POSTGRES_PASSWORD }}" > secrets/postgres_password.txt

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for all services to be healthy
        run: |
          timeout=120
          elapsed=0
          services="api worker frontend postgres redis"

          while [ $elapsed -lt $timeout ]; do
            unhealthy=""
            failed=""
            for service in $services; do
              container_id=$(docker compose ps -q "$service")
              if [ -z "$container_id" ]; then
                status="missing"
              else
                status=$(docker inspect --format='{{.State.Health.Status}}' "$container_id" 2>/dev/null || echo "no-healthcheck")
              fi
              echo "Service ${service}: ${status}"
              if [ "$status" = "unhealthy" ]; then
                failed="$failed $service"
              elif [ "$status" != "healthy" ]; then
                unhealthy="$unhealthy $service:$status"
              fi
            done

            if [ -n "$failed" ]; then
              echo "Service(s) reported unhealthy, failing fast:$failed"
              docker compose ps
              exit 1
            fi

            if [ -z "$unhealthy" ]; then
              echo "All services healthy after ${elapsed}s"
              exit 0
            fi

            echo "Waiting (${elapsed}s elapsed) — not yet healthy:$unhealthy"
            sleep 5
            elapsed=$((elapsed + 5))
          done

          echo "Timed out waiting for services to become healthy"
          docker compose ps
          exit 1

      - name: Run integration tests
        working-directory: ./tests
        run: npm test

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v